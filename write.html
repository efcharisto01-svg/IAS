<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<title>IAS 글쓰기</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/glass.css">
<style>
  /* 레이아웃만. 색·모양은 공용 부품(glass.css)을 쓴다. */
  .page { max-width: 760px; margin: 0 auto; padding: 8px 14px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .card { padding: 16px; display: grid; gap: 10px; }
  .card .field + .field { margin-top: 0; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 479px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools .btn { width: auto; padding-inline: 16px; }
  .hint { font-size: 12px; color: var(--text-3); margin: 0 4px; }
  .errmsg { margin: 0 4px; font-size: 13px; color: var(--danger); min-height: 1em; }
  .submit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .state { padding: 28px 16px; text-align: center; color: var(--text-2); font-size: 14px; }
  .opts .menu-row { cursor: default; }
  .opts .menu-row span.grow { flex: 1; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="page" id="page">
  <form class="glass card rise" style="--i:0" id="form" novalidate hidden>
    <div class="two">
      <div class="field combo" id="boardBox">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <input id="board" type="text" role="combobox" aria-expanded="false" aria-controls="boardList" aria-label="게시판" placeholder="게시판 선택" autocomplete="off">
        <button type="button" class="trailing" tabindex="-1" aria-label="게시판 목록"><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <ul class="combo-list" id="boardList" role="listbox" hidden></ul>
      </div>
      <div class="field combo" id="catBox">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <input id="cat" type="text" role="combobox" aria-expanded="false" aria-controls="catList" aria-label="분류" placeholder="분류 (선택)" autocomplete="off">
        <button type="button" class="trailing" tabindex="-1" aria-label="분류 목록"><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <ul class="combo-list" id="catList" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="field" id="titleBox"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg><input id="title" type="text" maxlength="120" placeholder="제목" aria-label="제목" autocomplete="off"></div>
    <textarea class="textarea" id="body" maxlength="20000" placeholder="내용을 입력하세요" aria-label="내용"></textarea>
    <div class="tools">
      <button class="btn btn-glass" id="addImg" type="button">사진 넣기</button>
      <button class="btn btn-glass" id="addFile" type="button">파일 첨부</button>
    </div>
    <input id="imgIn" type="file" accept="image/*" multiple>
    <input id="fileIn" type="file" multiple>
    <p class="hint">사진은 커서 위치에 들어갑니다 (최대 10장). 파일은 5개까지, 하나당 10MB까지 올릴 수 있습니다.</p>
    <div id="attached"></div>
    <div class="menu-group opts" id="opts" hidden>
      <div class="menu-row"><span class="grow">상단 고정 (공지)</span><button class="switch" id="pin" type="button" role="switch" aria-checked="false" aria-label="상단 고정"></button></div>
      <div class="menu-row"><span class="grow">필독 (모두에게 알림)</span><button class="switch" id="req" type="button" role="switch" aria-checked="false" aria-label="필독"></button></div>
    </div>
    <p class="errmsg" id="err" role="alert"></p>
    <div class="submit"><a class="btn btn-glass" id="cancel" href="board.html">취소</a><button class="btn btn-primary" id="save" type="submit"><span>등록</span></button></div>
  </form>
  <section class="glass state" id="denied" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/push.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/topbar.js"></script>
<script src="js/combobox.js"></script>
<script src="js/write.js"></script>
</body>
</html>
