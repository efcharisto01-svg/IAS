<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IAS 로그인</title>
<link rel="stylesheet" href="css/glass.css">
<style>
  .page {
    min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    max-width: 440px; margin: 0 auto;
  }
  .brand { text-align: center; margin-bottom: 28px; }
  .logo {
    width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 22px;
    display: grid; place-items: center; color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(145deg, #5eb0ff, #0a84ff 55%, #5e5ce6);
    box-shadow: 0 10px 28px rgba(10, 132, 255, .4), inset 0 1px 0 rgba(255, 255, 255, .5);
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.5px; }
  .brand p { margin: 0; font-size: 15px; }
  .card { padding: 22px 18px 18px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 16px 2px 18px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text-2); cursor: pointer; }
  .check input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--field-bg); border: 1.5px solid var(--separator); display: grid; place-items: center; margin: 0; transition: background .2s; }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; rotate: 45deg; translate: 0 -1px; }
  .error { min-height: 20px; margin: 12px 4px 0; font-size: 14px; color: var(--danger); text-align: center; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; font-size: 13px; color: var(--text-3); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--separator); }
  .foot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text-3); }
  .foot a { color: var(--text-2); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { translate: -6px 0; } 40%,80% { translate: 6px 0; } }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="page">
  <header class="brand">
    <div class="logo" aria-hidden="true">IAS</div>
    <h1>IAS 그룹웨어</h1>
    <p class="muted">통합 행정 플랫폼에 로그인하세요</p>
  </header>

  <form id="loginForm" class="glass card" novalidate autocomplete="on">
    <label class="field">
      <span class="sr-only">회사 코드</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M15 10h.01M9 13h.01M15 13h.01"/></svg>
      <input id="company" name="company" placeholder="회사 코드" autocomplete="organization" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" required>
    </label>
    <label class="field">
      <span class="sr-only">아이디</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <input id="userId" name="username" placeholder="아이디 또는 이메일" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label class="field">
      <span class="sr-only">비밀번호</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="button" class="trailing" id="togglePw" aria-label="비밀번호 표시">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </label>

    <div class="row">
      <label class="check"><input type="checkbox" id="remember"> 로그인 유지</label>
      <button type="button" class="link" id="forgot">비밀번호 찾기</button>
    </div>

    <button class="btn btn-primary" id="submit" type="submit"><span>로그인</span></button>
    <p class="error" id="error" role="alert" aria-live="polite"></p>

    <div class="divider">또는</div>
    <button type="button" class="btn btn-glass" id="sso">SSO로 로그인</button>
  </form>

  <p class="foot">계정이 없으신가요? 회사 관리자에게 문의하세요<br>© IAS</p>
</main>

<script src="js/login.js"></script>
</body>
</html>
