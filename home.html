<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<title>IAS 홈</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/glass.css">
<style>
  /* 임시 화면: 로그인 결과(사용자, 역할, 허용된 앱과 위젯)를 확인하는 용도. 홈 화면 확정 후 교체한다. */
  .page { min-height: calc(100dvh - 64px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
  .card { padding: 20px 18px; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.4px; }
  dl { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px; }
  dt { color: var(--text-2); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .pill { display: inline-block; margin: 0 4px 4px 0; padding: 2px 10px; border-radius: 999px; background: var(--field-bg); font-size: 13px; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="page">
  <section class="glass card rise" style="--i:0">
    <h1 id="hello">로그인 확인 중…</h1>
    <p class="muted" id="co"></p>
    <dl>
      <dt>역할</dt><dd id="roles"></dd>
      <dt>허용된 앱</dt><dd id="apps"></dd>
      <dt>허용된 위젯</dt><dd id="widgets"></dd>
    </dl>
  </section>
  <button class="btn btn-glass rise" style="--i:1" id="logout" type="button">로그아웃</button>
</main>
<script src="js/push.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/topbar.js"></script>
<script src="js/home-check.js"></script>
</body>
</html>
