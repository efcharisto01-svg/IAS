<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<title>IAS 게시글</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/glass.css">
<style>
  /* 레이아웃만. 색·모양은 공용 부품(glass.css)을 쓴다. */
  .page { max-width: 760px; margin: 0 auto; padding: 8px 14px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .card { padding: 18px 18px 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.35; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .by { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--text-2); padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--separator); }
  .files { margin-top: 18px; }
  .files h2, .cmts h2 { margin: 0 0 8px; font-size: 14px; color: var(--text-2); }
  .cmts { padding: 16px 18px 18px; }
  .cform { display: grid; gap: 8px; margin-top: 12px; }
  .cform .btn { justify-self: end; min-width: 96px; }
  .row-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .row-actions .btn { min-width: 84px; }
  .state { padding: 28px 16px; text-align: center; color: var(--text-2); font-size: 14px; }
  .back { justify-self: start; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="page" id="page">
  <section class="glass card rise" style="--i:0" id="card" hidden>
    <div class="tags" id="tags"></div>
    <h1 id="title"></h1>
    <div class="by" id="by"></div>
    <div class="post-body" id="body"></div>
    <div class="files" id="files" hidden><h2>첨부파일</h2><div id="fileList"></div></div>
  </section>
  <div class="row-actions" id="actions" hidden>
    <button class="btn btn-glass" id="edit" type="button" hidden>수정</button>
    <button class="btn btn-glass" id="del" type="button" hidden>삭제</button>
    <a class="btn btn-glass" id="list" href="board.html">목록</a>
  </div>
  <section class="glass cmts rise" style="--i:1" id="cmts" hidden>
    <h2 id="cmtTitle">댓글</h2>
    <div id="cmtList"></div>
    <form class="cform" id="cform" novalidate>
      <textarea class="textarea compact" id="cbody" maxlength="1000" placeholder="댓글을 입력하세요" aria-label="댓글"></textarea>
      <button class="btn btn-primary" id="csend" type="submit"><span>등록</span></button>
    </form>
  </section>
  <section class="glass state" id="err" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/push.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/topbar.js"></script>
<script src="js/post.js"></script>
</body>
</html>
