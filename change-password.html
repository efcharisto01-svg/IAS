<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<title>IAS 비밀번호 변경</title>
<link rel="stylesheet" href="css/glass.css">
<style>
  .page { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.5px; text-align: center; }
  .lead { margin: 0 0 22px; text-align: center; font-size: 15px; }
  .card { padding: 22px 18px 18px; }
  .rules { margin: 12px 4px 16px; font-size: 13px; color: var(--text-2); }
  .error { min-height: 20px; margin: 12px 4px 0; font-size: 14px; color: var(--danger); text-align: center; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="page">
  <h1 class="rise" style="--i:0">비밀번호 변경</h1>
  <p class="lead muted rise" style="--i:0" id="lead">새 비밀번호를 정해 주세요.</p>
  <form id="pwForm" class="glass card rise" style="--i:1" novalidate>
    <label class="field"><span class="sr-only">현재 비밀번호</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="current" type="password" placeholder="현재(임시) 비밀번호" autocomplete="current-password" required></label>
    <label class="field"><span class="sr-only">새 비밀번호</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="next" type="password" placeholder="새 비밀번호" autocomplete="new-password" required></label>
    <label class="field"><span class="sr-only">새 비밀번호 확인</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="again" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" required></label>
    <p class="rules">8자 이상, 영문과 숫자를 함께 사용하세요.</p>
    <button class="btn btn-primary" id="submit" type="submit"><span>변경하기</span></button>
    <p class="error" id="error" role="alert" aria-live="polite"></p>
  </form>
</main>
<script src="js/auth.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
